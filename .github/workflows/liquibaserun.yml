name: Liquibase Run

on:
  push:
    branches:
      - main

jobs:
  run-liquibase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Connect GitHub runner to Tailscale
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # Build Liquibase Docker image
      - name: Build Liquibase Docker
        run: docker build -t liquibase-run .

      # Run Liquibase (connects to remote Postgres)
      - name: Run Liquibase
        run: docker run --rm liquibase-run
