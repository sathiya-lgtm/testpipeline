name: Liquibase Run

on:
  push:
    branches:
      - main

jobs:
  run-liquibase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Start containers
        run: docker compose up --build --abort-on-container-exit

      - name: Debug Liquibase files
        run: |
          docker exec sample_liquibase ls -l /liquibase
          docker exec sample_liquibase ls -l /liquibase/sampel

      - name: Verify Postgres tables
        run: |
          docker exec sample_postgres psql -U postgres -d sampledb -c "\dt"
          docker exec sample_postgres psql -U postgres -d sampledb -c "SELECT COUNT(*) FROM users;"

      - name: Tear down
        run: docker compose down
