name: Liquibase Run

on:
  push:
    branches:
      - main

jobs:
  run-liquibase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Start containers
        run: |
          docker compose up -d --build

      # Wait for Postgres to be ready
      - name: Wait for Postgres
        run: |
          until docker exec sample_postgres pg_isready -U postgres; do
            echo "Waiting for Postgres..."
            sleep 5
          done

      - name: Run Liquibase update
        run: docker exec sample_liquibase liquibase update

      - name: Verify Postgres tables
        run: |
          docker exec sample_postgres psql -U postgres -d sampledb -c "\dt"
          docker exec sample_postgres psql -U postgres -d sampledb -c "SELECT COUNT(*) FROM users;"

      - name: Tear down
        run: docker compose down
