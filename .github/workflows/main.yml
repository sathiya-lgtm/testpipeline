name: Sample CI Workflow

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Give execute permission
        run: chmod +x .github/workflows/install_npm.sh

      - name: Run npm install script
        run: bash .github/workflows/install_npm.sh
